name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=""
          for name in SSH_HOST SSH_USER SSH_KEY DEPLOY_PATH; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository or 'production' environment secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions. See DEPLOY.md."
            exit 1
          fi
          echo "All required deployment secrets are present (SSH_PORT=$SSH_PORT)."

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Seed known_hosts so the first ssh/scp does not trip on an unknown
          # host. Best-effort: if the scan fails we still attempt the deploy,
          # which surfaces a clearer connection error than a bare exit code 1.
          if ! ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>keyscan.err; then
            echo "::warning::ssh-keyscan could not reach $SSH_HOST:$SSH_PORT; relying on StrictHostKeyChecking=accept-new"
            cat keyscan.err
          fi
          rm -f keyscan.err

      - name: Copy compose file to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" docker-compose.prod.yml \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/docker-compose.prod.yml"

      - name: Pull and restart
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          # Values are baked into the script body (not the ssh command line) so
          # the registry token never shows up in the server's process list.
          {
            echo "DEPLOY_PATH=$(printf %q "$DEPLOY_PATH")"
            echo "APP_IMAGE=$(printf %q "$APP_IMAGE")"
            echo "REGISTRY_USER=$(printf %q "$REGISTRY_USER")"
            echo "REGISTRY_TOKEN=$(printf %q "$REGISTRY_TOKEN")"
          } > remote-deploy.sh

          cat >> remote-deploy.sh <<'REMOTE'
          set -euo pipefail

          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          cd "$DEPLOY_PATH"
          if [ ! -f .env ]; then
            echo "Missing $DEPLOY_PATH/.env on the server (see .env.production.example)." >&2
            exit 1
          fi

          # Pin this release to the exact image we just built.
          grep -v '^APP_IMAGE=' .env > .env.next || true
          echo "APP_IMAGE=$APP_IMAGE" >> .env.next
          mv .env.next .env

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker compose -f docker-compose.prod.yml ps
          docker image prune -f
          REMOTE

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' < remote-deploy.sh
          rm -f remote-deploy.sh
